<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- plan.md §21.5 item 4. This line and the og:title below were three
         versions stale: "see what your SQL actually does" is the tagline §19.4
         recorded as *rejected* — true, and saying nothing the product name did
         not. The app header, the OG card and this markup now all read the same
         concrete sentence. -->
    <title>QueryLens — watch a SQL query become a B+Tree traversal</title>
    <meta
      name="description"
      content="An in-browser toy database engine that animates a SQL query through parser, planner, optimizer, execution, buffer pool and B+Tree index. Predict what happens next, then watch it run."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- plan.md §16.2 item 8. iOS ignores an SVG here and falls back to
         screenshotting the page, which makes a home-screen tile of grey text.
         One 180×180 file: iOS downsamples for every other slot, and shipping
         eight sizes is shipping seven that rot. Generated from favicon.svg by
         scripts/build-icons.py, which also renders the 16px legibility check
         that item asks for. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- plan.md §H1. The worker in public/sw.js reads this build's files; the manifest is one of them. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfc" />

    <!-- plan.md §16.2 item 1. Both faces are above the fold — the header and
         narration are the text face, the SQL editor and every page id are the
         monospace — so both are worth the preload, and there is no third to
         argue about. `crossorigin` is required even same-origin: fonts are
         fetched in CORS mode, and a preload without it fetches the file twice.
         Discovered here rather than after the CSS parses, which is what makes
         the swap short enough for the adjusted fallbacks to cover it. -->
    <link
      rel="preload"
      href="/fonts/querylens-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/querylens-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Blocking on purpose: it resolves the theme before the first paint, and
         the app bundle is a module, so it runs too late to prevent a flash.
         A separate file rather than inline because the CSP has no nonce. -->
    <script src="/theme.js"></script>
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- plan.md §14.1 item 8. Distribution is a link posted to HN, Reddit or a
         course page, so this card is the landing page. %SITE_URL% is filled in
         at build time by vite.config.ts — scrapers drop relative image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QueryLens" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="QueryLens — watch a SQL query become a B+Tree traversal" />
    <meta
      property="og:description"
      content="Watch a SQL query move through parser, planner, optimizer, B+Tree index and buffer pool — one step at a time, on a query you typed. A simplified educational model, not a real engine."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Regenerated by `pnpm og` from a real trace (plan.md §19.3), so this
         text has to be re-checked whenever that runs. It said "four frames"
         through a change that made it eight, which is exactly how alt text
         rots: nothing renders it, so nothing contradicts it. -->
    <meta
      property="og:image:alt"
      content="The QueryLens buffer pool mid-eviction: eight frames of a sequential scan, frame 0 outlined in red and labelled EVICTED, hit and miss counters below, and a line of narration explaining that LRU picked that page because it was used least recently."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
