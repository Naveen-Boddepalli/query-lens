<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueryLens — see what your SQL actually does</title>
    <meta
      name="description"
      content="An in-browser toy database engine that animates a SQL query through parser, planner, optimizer, execution, buffer pool and B+Tree index. Predict what happens next, then watch it run."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#12151c" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- plan.md §14.1 item 8. Distribution is a link posted to HN, Reddit or a
         course page, so this card is the landing page. %SITE_URL% is filled in
         at build time by vite.config.ts — scrapers drop relative image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QueryLens" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="QueryLens — see what your SQL actually does" />
    <meta
      property="og:description"
      content="Watch a SQL query move through parser, planner, optimizer, B+Tree index and buffer pool — one step at a time, on a query you typed. A simplified educational model, not a real engine."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The QueryLens buffer pool mid-eviction: four frames, one evicted, one being read from disk, with hit and miss counts."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
