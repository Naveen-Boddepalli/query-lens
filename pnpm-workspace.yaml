# CodeMirror breaks — in types and at runtime — if two copies of
# @codemirror/state or @codemirror/view are loaded. Force exactly one: the
# version package.json depends on (`$name`), so a bump there is the bump here.
# These used to be literal versions, and a copy in package.json's `pnpm` field
# — which pnpm 11 does not read — is what Dependabot kept raising, so the
# installed view and state sat at 6.43.10 and 6.7.2 behind a package.json that
# claimed 6.43.13 and 6.7.6.
overrides:
  '@codemirror/state': $@codemirror/state
  '@codemirror/view': $@codemirror/view

# plan.md §14.1 item 7. pnpm 11 defaults minimumReleaseAge to 1440 minutes, but
# `pnpm config get minimumReleaseAge` returns undefined here — an implicit
# default is not something CI's pnpm can be assumed to share, so it is written
# down. 10080 minutes = 7 days: long enough that a hijacked release is usually
# yanked before this project would ever resolve it.
minimumReleaseAge: 10080

# flowinger is our own package. 1.0.1 was published 2026-10-17 — younger than the rule above allows, so it is
# exempt until it has aged past it. Delete this entry on or after 2026-10-24; nothing else is exempt.
minimumReleaseAgeExclude:
  - flowinger

# A transitive dependency may not resolve from a git URL or a tarball.
blockExoticSubdeps: true

# Verified empty for the app's own dependency graph — not one package there has
# a preinstall, install or postinstall script. Stating that explicitly means
# adding one becomes a diff someone has to approve, rather than a script that
# just starts running. The two entries below are the one deliberate exception,
# and are not part of that graph at all: this project has no Worker code of its
# own, but Cloudflare's build step injects `wrangler` as a devDependency to
# actually publish `dist/` (it's what serves public/_headers, _redirects and
# 404.html), and wrangler's own esbuild/workerd need their install scripts to
# fetch their native binaries. Blocking those broke every deploy with nothing
# more specific than "error occurred while running deploy command".
# `allowBuilds` is a *mapping*, not a list — under the pnpm@11.1.2 this
# project pins, a `- esbuild` list form parses without error but is silently
# treated as empty, which is why the first attempt at this exception did
# nothing and the deploy kept failing identically. Confirmed by reproducing
# the exact `[ERR_PNPM_IGNORED_BUILDS]` locally under pnpm@11.1.2 with the
# list form, then again with the mapping form below, which actually runs
# both postinstall scripts.
allowBuilds:
  esbuild: true
  workerd: true

