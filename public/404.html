<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — QueryLens</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#090913" />
    <!-- Deliberately standalone: no bundle, no JS. A 404 that depends on the
         app loading is a 404 that breaks whenever the app does. Inline styles
         are permitted by the CSP's style-src, which CodeMirror already needs.

         Since plan.md §21.5, `public/_redirects` rewrites every unmatched path
         to the SPA, so an ordinary unknown route (`/stages/nope`) is now drawn
         by React Router as NotFoundPage *inside* the loaded app. This file is
         only reached when that app cannot load at all — a bad deploy, a
         chunk 404, a Cloudflare-side error — so its copy speaks to that. -->
    <style>
      /* Standalone, so it cannot read the app's stored choice — it follows the
         system only. Dark first, because that is the app's own default. */
      :root {
        color-scheme: dark;
        --bg: oklch(0.17 0.012 260);
        --fg: oklch(0.95 0.005 260);
        --dim: oklch(0.72 0.014 260);
        --accent: oklch(0.78 0.14 196);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: oklch(0.99 0.002 260);
          --fg: oklch(0.28 0.02 262);
          --dim: oklch(0.42 0.02 262);
          --accent: oklch(0.52 0.12 218);
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--dim);
        font-size: 0.875rem;
        line-height: 1.6;
      }
      a {
        justify-self: center;
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--accent);
        border-radius: 0.375rem;
        background: color-mix(in oklab, var(--accent) 15%, transparent);
        color: inherit;
        font-size: 0.875rem;
        text-decoration: none;
      }
      a:hover {
        background: color-mix(in oklab, var(--accent) 25%, transparent);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>QueryLens didn’t load</h1>
    <p>
      You’re seeing this static page because the app itself couldn’t start —
      usually a stale link to a build that no longer exists.<br />
      Reloading from the root normally fixes it.
    </p>
    <a href="/">Reload QueryLens</a>
  </body>
</html>
