# plan.md §14.1 items 1 and 2. Every action is pinned to a full commit SHA:
# mutable tags are how tj-actions/changed-files (2025) and trivy-action (2026)
# exfiltrated CI secrets. The tag on the comment is documentation, not the pin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes. A compromised dependency in the graph gets a read-only
# token, which is the whole point of setting this at workflow level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before setup-node, so its `cache: pnpm` can find the store.
      # No `version:` — the action reads `packageManager` from package.json,
      # which is the same pin the developer machine resolves.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # --frozen-lockfile: a lockfile that does not match package.json fails the
      # build rather than silently resolving something nobody reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # plan.md §14.2. The budget is the durable half of the bundle item: the
      # size can move, but only in a commit that says so.
      - name: Bundle budget
        run: pnpm budget

      # The only test that catches "the deploy is broken": it loads dist/ in a
      # real browser. Also where axe runs, since jsdom cannot judge contrast.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
