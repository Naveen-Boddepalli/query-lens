# plan.md §14.1 items 1 and 2. Every action is pinned to a full commit SHA:
# mutable tags are how tj-actions/changed-files (2025) and trivy-action (2026)
# exfiltrated CI secrets. The tag on the comment is documentation, not the pin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes. A compromised dependency in the graph gets a read-only
# token, which is the whole point of setting this at workflow level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs this change needs (scripts/ci-scope.ts). A docs-only PR runs none of the checks below;
  # a change only to the oracle, CLI, MCP server, package wrappers or build scripts skips the Playwright
  # shards. Plain git, not a paths-filter action: the third-party path-filter actions are exactly the
  # supply-chain risk the header describes. Workflow-level `paths-ignore` was not used either: it would
  # leave `ci-gate` unreported on a docs PR, and a required check that never reports blocks the merge.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # A PR is diffed against its merge base with main; a push to main against the commit before it. If
      # that base is missing (a new branch, a force-push) the list is empty and ci-scope runs everything.
      - name: Work out the scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; range="${base}...HEAD"; else base="$PUSH_BEFORE"; range="${base}..HEAD"; fi
          changed=""
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$range")"
          fi
          echo "Changed files:"; echo "${changed:-(could not be worked out — running everything)}"
          echo "$changed" | node --experimental-strip-types scripts/ci-scope.ts --stdin | tee -a "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint & A11y
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  unit-test:
    name: Unit & Integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (vitest)
        run: pnpm test

  build-and-budget:
    name: Build & Bundle Budget
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # plan.md §14.2. The budget is the durable half of the bundle item: the
      # size can move, but only in a commit that says so.
      - name: Bundle budget
        run: pnpm budget

  cli-test:
    name: CLI Smoke Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CLI Help
        run: pnpm test:cli

      - name: CLI Query Execution
        run: pnpm querylens "SELECT * FROM users WHERE id = 5"

      - name: CLI Clock Policy
        run: pnpm querylens "SELECT * FROM users WHERE age > 30" --policy clock

      - name: CLI JSON Mode
        run: pnpm querylens "SELECT * FROM orders WHERE id = 1" --dataset orders --json

  # Three shards, each on its own runner. One runner ran all ~600 tests on a single worker (a private
  # repository's runner has 2 vCPUs, so Playwright starts one) and sat at this job's 20 minutes: after
  # the v2 merge most runs timed out at ~560 of 608 tests, and Playwright 1.64 made each test about a
  # third slower again. A shard builds and installs for itself — about the same runner minutes in all,
  # a third of the wall time, and the 20 minutes is headroom again. `ci-gate` still needs `e2e-test`,
  # which succeeds only when every shard does; `fail-fast: false` lets the other shards finish and
  # report when one fails. Which test runs in which shard is `e2e/support/shards.ts`'s: it deals them
  # out in turn, so the slow axe audits are spread over all three instead of filling one.
  e2e-test:
    name: E2E & Accessibility (Playwright & Axe) ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The only test that catches "the deploy is broken": it loads dist/ in a
      # real browser. Also where axe runs, since jsdom cannot judge contrast.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke test
        env:
          SHARD: ${{ matrix.shard }}/3
        run: pnpm test:e2e --shard="$SHARD"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # plan.md §25.4 A4 / §25.5 rule 4. Not a gate — it cannot know whether a preview
  # deploy was checked — but the first deploy failed three ways on config no
  # local check could see, so a change to that config is surfaced on the PR
  # instead of being one more line in a diff. Deliberately outside `ci-gate`'s
  # `needs`: it informs, it never blocks.
  deploy-config-notice:
    name: Deploy config changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Look for deploy-config changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          hits="$(echo "$changed" | xargs node --experimental-strip-types scripts/deploy-config.ts)"
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS=$'\t' read -r file why; do
              echo "::warning file=${file},title=Deploy config changed::${why}. Verify on a preview deploy before merging (RELEASING.md)."
            done
            echo "### Deploy config changed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$hits" | awk -F'\t' '{ printf "- \`%s\` — %s\n", $1, $2 }' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Tick the preview-deploy item in the PR checklist once you have looked at it (see RELEASING.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The one required check. A job skipped because `changes` said its files were untouched counts as
  # passed; anything else that is not a success — including `changes` itself failing, which skips
  # everything downstream — fails the gate.
  ci-gate:
    name: All CI Tests Passed
    runs-on: ubuntu-latest
    needs: [changes, typecheck, lint, unit-test, build-and-budget, cli-test, e2e-test]
    if: always()
    steps:
      - name: Check status of all required CI checks
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: >-
            typecheck=${{ needs.typecheck.result }}
            lint=${{ needs.lint.result }}
            unit-test=${{ needs.unit-test.result }}
            build-and-budget=${{ needs.build-and-budget.result }}
            cli-test=${{ needs.cli-test.result }}
            e2e-test=${{ needs.e2e-test.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "Change detection did not succeed ($CHANGES), so nothing was checked."
            exit 1
          fi
          failed=0
          for r in $RESULTS; do
            echo "$r"
            case "${r#*=}" in success|skipped) ;; *) failed=1 ;; esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required CI checks failed."
            exit 1
          fi
          echo "All CI checks completed successfully (skipped = not affected by this change)."
