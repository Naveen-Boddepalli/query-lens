# plan.md §14.1 items 1 and 2. Every action is pinned to a full commit SHA:
# mutable tags are how tj-actions/changed-files (2025) and trivy-action (2026)
# exfiltrated CI secrets. The tag on the comment is documentation, not the pin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes. A compromised dependency in the graph gets a read-only
# token, which is the whole point of setting this at workflow level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint & A11y
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  unit-test:
    name: Unit & Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (vitest)
        run: pnpm test

  build-and-budget:
    name: Build & Bundle Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # plan.md §14.2. The budget is the durable half of the bundle item: the
      # size can move, but only in a commit that says so.
      - name: Bundle budget
        run: pnpm budget

  cli-test:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CLI Help
        run: pnpm test:cli

      - name: CLI Query Execution
        run: pnpm querylens "SELECT * FROM users WHERE id = 5"

      - name: CLI Clock Policy
        run: pnpm querylens "SELECT * FROM users WHERE age > 30" --policy clock

      - name: CLI JSON Mode
        run: pnpm querylens "SELECT * FROM orders WHERE id = 1" --dataset orders --json

  e2e-test:
    name: E2E & Accessibility (Playwright & Axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The only test that catches "the deploy is broken": it loads dist/ in a
      # real browser. Also where axe runs, since jsdom cannot judge contrast.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # plan.md §25.4 A4 / §25.5 rule 4. Not a gate — it cannot know whether a preview
  # deploy was checked — but the first deploy failed three ways on config no
  # local check could see, so a change to that config is surfaced on the PR
  # instead of being one more line in a diff. Deliberately outside `ci-gate`'s
  # `needs`: it informs, it never blocks.
  deploy-config-notice:
    name: Deploy config changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Look for deploy-config changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          hits="$(echo "$changed" | xargs node --experimental-strip-types scripts/deploy-config.ts)"
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS=$'\t' read -r file why; do
              echo "::warning file=${file},title=Deploy config changed::${why}. Verify on a preview deploy before merging (RELEASING.md)."
            done
            echo "### Deploy config changed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$hits" | awk -F'\t' '{ printf "- \`%s\` — %s\n", $1, $2 }' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Tick the preview-deploy item in the PR checklist once you have looked at it (see RELEASING.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

  ci-gate:
    name: All CI Tests Passed
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-test, build-and-budget, cli-test, e2e-test]
    if: always()
    steps:
      - name: Check status of all required CI checks
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-test.result }}" != "success" ] || \
             [ "${{ needs.build-and-budget.result }}" != "success" ] || \
             [ "${{ needs.cli-test.result }}" != "success" ] || \
             [ "${{ needs.e2e-test.result }}" != "success" ]; then
            echo "One or more required CI checks failed."
            exit 1
          fi
          echo "All CI checks completed successfully!"
